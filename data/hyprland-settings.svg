<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>

    <!-- Hyprland teardrop gradient (Catppuccin sky → blue → mauve) -->
    <linearGradient id="drop" x1="0.3" y1="0" x2="0.7" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#89dceb"/>
      <stop offset="45%"  stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>

    <!-- Subtle inner shine -->
    <linearGradient id="shine" x1="0.15" y1="0" x2="0.85" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow around teardrop -->
    <filter id="glow" x="-22%" y="-22%" width="144%" height="144%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.54  0 0 0 0 0.71  0 0 0 0 0.98  0 0 0 0.55 0"
        result="tinted"/>
      <feMerge>
        <feMergeNode in="tinted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow on wrench -->
    <filter id="wShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6"
                    flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Hyprland teardrop
       Bottom circle: center (256, 348), radius 156
       Top point:     (256, 50)
  -->
  <path d="M 256,50
           C 364,150 412,248 412,348
           A 156,156 0 1 1 100,348
           C 100,248 148,150 256,50 Z"
        fill="url(#drop)" filter="url(#glow)"/>

  <!-- Glass-shine overlay -->
  <path d="M 256,50
           C 364,150 412,248 412,348
           A 156,156 0 1 1 100,348
           C 100,248 148,150 256,50 Z"
        fill="url(#shine)"/>

  <!-- Open-end wrench, white, rotated −40°, centered at (256, 308)
       Geometry (local, before rotation):
         Left jaw   − x: −38…−15   y: −100…10
         Right jaw  − x:  15… 38   y: −100…10
         Body bar   − x: −38… 38   y:   10…34
         Handle     − x: −13… 13   y:   34…124
         End cap    − circle r 15 at (0, 124)
  -->
  <g transform="translate(256,308) rotate(-40)"
     fill="white" opacity="0.93" filter="url(#wShadow)">
    <!-- Left jaw -->
    <rect x="-38" y="-100" width="23" height="110" rx="7" ry="7"/>
    <!-- Right jaw -->
    <rect x="15"  y="-100" width="23" height="110" rx="7" ry="7"/>
    <!-- Body bar connecting jaws to handle -->
    <rect x="-38" y="10"   width="76" height="24"  rx="9" ry="9"/>
    <!-- Handle -->
    <rect x="-13" y="34"   width="26" height="90"  rx="13" ry="13"/>
    <!-- Rounded handle tip -->
    <circle cx="0" cy="124" r="15"/>
  </g>
</svg>
