[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyprland-settings"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.46",
]

[project.scripts]
hyprland-settings = "hyprland_settings.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
